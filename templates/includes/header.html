{% load static %}
<!-- Header Start -->
<header id="header">
    <div class="main-header">
        <div class="container-fluid">
            <div class="row">
                <div class="col-lg-6 col-md-6 col-sm-12 col-xs-12">
                    <div class="logo">
                        <figure>
                            <a href="" class="light-logo">
                                <img src="{% static 'logo/foodOnlineLogo.png' %}" alt="FoodBakery" width="150px" style="padding-top: 15px">
                            </a>
                        </figure>
                    </div>
                   
                </div>
                <div class="col-lg-6 col-md-6 col-sm-12 col-xs-12">
                    
                    <div class="login-option"> 
                        {% if user.is_authenticated %} 
                        <a href="">
                            <i class="fa fa-shopping-cart text-danger" style="font-size: 20px;"></i>
                            <span class="badge badge-warning" id="cart_counter" style="border-radius:50px; position: relative; bottom: 10px; left:-5px;">0</span>
                        </a>
                        {% endif %}
                        
                        <a href="" class="btn btn-outline-danger text-uppercase font-weight-bold">Marketplace</a>
                        {% if user.is_authenticated %} 
                        <a class="cs-color cs-popup-joinus-btn login-popup rounded-xl p-1 bg-primary text-white" href="">Dashboard</a>

                        <a class="cs-color cs-popup-joinus-btn login-popup rounded-xl p-1 bg-light  text-danger" href="{% url 'logout' %}">Logout</a> {% else %} <a class="cs-color cs-popup-joinus-btn login-popup rounded-xl p-1 bg-primary text-white" href="{% url 'login' %}">Login</a>
                        <a class="cs-color cs-popup-joinus-btn login-popup rounded-xl p-1 bg-primary text-white" href="{% url 'registerUser' %}">Register</a>
                        <a class="get-start-btn" href="{% url 'registerVendor' %}"> Register Restaurant </a> {% endif %}
                    </div>
                </div>
            </div>
        </div>
    </div>
</header>
<!-- Header End -->
